name: Pages demo

# Publishes the browser build (sample data, localStorage only) for the live demo
# at lab.rokogrga.com/momentum-lab/app/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Absolute base: the app is served through the lab's proxy at /momentum-lab/app/,
      # with or without the trailing slash. (Not meant to be opened on github.io directly.)
      - run: npx vite build --base=/momentum-lab/app/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
